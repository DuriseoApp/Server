# 테스트 전용 값. 실제 비밀 키가 아니다 (32바이트 이상이어야 서버가 뜬다)
duriseo.jwt.secret=test-only-fake-jwt-secret-not-for-production-0123456789
# Kakao 웹훅 인증 테스트용 값. 실제 앱 ID·어드민 키가 아니다
duriseo.kakao.app-id=987654
duriseo.kakao.admin-key=fake-kakao-admin-key-for-tests
# 스케줄러 자동 실행을 끈다. 테스트가 시계를 옮기며 작업 메서드를 직접 부른다
duriseo.jobs.enabled=false
# 프로필 사진 테스트 저장소 (로컬 디스크, 임시 폴더). 테스트가 시작 때 비운다
duriseo.storage.type=local
duriseo.storage.local-dir=${java.io.tmpdir}/duriseo-test-profile-images
