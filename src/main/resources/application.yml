# 공통 설정. 값은 환경변수로 넣는다 (.env.example, docs/SETUP.md). 실제 값을 이 파일에 쓰지 않는다.
spring:
  application:
    name: duriseo-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/duriseo}
    username: ${DB_USERNAME:duriseo}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway 마이그레이션으로만 바꾼다 (ERD 1장)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  task:
    scheduling:
      pool:
        size: 3 # 일정 알림·기념일 알림·정리 작업이 서로 기다리지 않게 (같은 작업은 겹치지 않는다)
  servlet:
    multipart:
      max-file-size: 10MB # 프로필 사진 원본 최대 10MB (NFR-FILE-01)
      max-request-size: 11MB

server:
  shutdown: graceful
  tomcat:
    max-swallow-size: 20MB # 한도(10MB)를 넘는 업로드도 끝까지 받아 413으로 답하게 (기본 2MB면 연결이 끊긴다)

logging:
  pattern:
    level: "%5p [%X{traceId:-}]" # 로그에 traceId를 붙인다 (API.md 1.1)

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

duriseo:
  jobs:
    enabled: true # false면 스케줄러를 켜지 않는다 (테스트가 작업 메서드를 직접 부른다)
  jwt:
    secret: ${JWT_SECRET:} # 비어 있거나 32바이트 미만이면 서버가 시작하지 않는다
  google:
    web-client-id: ${GOOGLE_WEB_CLIENT_ID:}
  kakao:
    app-id: ${KAKAO_APP_ID:}
    admin-key: ${KAKAO_ADMIN_KEY:}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
    connect-timeout-millis: 5000 # FCM 연결 제한 시간
    read-timeout-millis: 10000 # FCM 응답 제한 시간
  push:
    threads: 2 # 푸시·동기화 신호 발송 스레드 수
    queue-capacity: 1000 # 대기 한도. 넘치면 그 신호는 버리고 경고 로그만 남긴다
  storage:
    type: ${STORAGE_TYPE:local} # local(맥·개발 서버) | s3(운영). API.md 8장
    local-dir: ${STORAGE_LOCAL_DIR:./data/profile-images}
    s3-bucket: ${STORAGE_S3_BUCKET:} # type=s3일 때 필수. S3 자격 증명은 EC2 역할을 쓴다 (키를 넣지 않는다)
    s3-region: ap-northeast-2
    cleanup-enabled: ${STORAGE_CLEANUP_ENABLED:false} # s3일 때 정리 작업 8단계 실행 여부. prod 앱만 true (다른 환경이 운영 버킷의 사진을 지우지 않게)
  image:
    jpeg-quality: 0.85 # 프로필 사진 재인코딩 JPEG 품질
    max-concurrent-processing: 1 # 사진 디코드·인코딩 동시 실행 수 (메모리, docs/SETUP.md "프로필 사진 메모리")

---
# 개발 환경 (AWS 서버의 dev 컨테이너)
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.duriseo.server: DEBUG

---
# 운영 환경 (AWS 서버의 prod 컨테이너)
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    com.duriseo.server: INFO
