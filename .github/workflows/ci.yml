name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 빌드와 테스트
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      # Testcontainers가 러너의 Docker로 PostgreSQL을 띄운다
      - name: ./gradlew build
        run: ./gradlew build --no-daemon
      # Dockerfile이 깨지지 않았는지 확인 (올리지는 않음. 배포 이미지는 deploy.yml이 ARM으로 만든다)
      - name: 이미지 빌드 확인
        run: docker build -t duriseo-server:ci .
      - name: 테스트 결과 요약
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for path in glob.glob("build/test-results/test/*.xml"):
              r = ET.parse(path).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0)); e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          line = f"테스트 {t}개 실행, 실패 {f + e}개, 건너뜀 {s}개"
          print(f"::notice title=테스트 결과::{line}")
          # 실패한 테스트 이름과 메시지를 Annotations에 올린다 (로그를 열지 않고도 원인을 보게)
          for path in glob.glob("build/test-results/test/*.xml"):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      msg = (bad.get("message") or "") + "\n" + (bad.text or "")[:1500]
                      esc = msg.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title=실패: {case.get('classname','').split('.')[-1]} > {case.get('name','')}::{esc}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### {line}\n")
          PY
      - name: 테스트 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7
