# Keep this file ASCII only: the CloudFormation console shows non-ASCII text as "???".
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Duriseo server infrastructure (Seoul). One EC2 instance running Docker Compose (dev app, prod app,
  PostgreSQL, Caddy), Elastic IP, prod DB backup bucket, ECR, GitHub Actions deploy role (OIDC),
  settings in Parameter Store. Setup guide: docs/SETUP.md section 3 in the Server repo.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Server" }
        Parameters: [InstanceType, LatestAmiId]
      - Label: { default: "Domains (DuckDNS)" }
        Parameters: [DomainProd, DomainDev, AcmeEmail]
      - Label: { default: "App settings (claude.ai project doc config/environment.md)" }
        Parameters: [GoogleWebClientId, KakaoAppId, FirebaseProjectId]
      - Label: { default: "GitHub deploy" }
        Parameters: [GitHubRepository, GitHubRepositoryWithIds, CreateGitHubOidcProvider]
    ParameterLabels:
      InstanceType: { default: "Server size" }
      LatestAmiId: { default: "OS image (leave as is)" }
      DomainProd: { default: "Prod API domain" }
      DomainDev: { default: "Dev API domain" }
      AcmeEmail: { default: "Certificate notice email" }
      GoogleWebClientId: { default: "Google web client ID" }
      KakaoAppId: { default: "Kakao app ID" }
      FirebaseProjectId: { default: "Firebase project ID" }
      GitHubRepository: { default: "Server repository (owner/repo)" }
      GitHubRepositoryWithIds: { default: "Server repository with IDs (owner@id/repo@id)" }
      CreateGitHubOidcProvider: { default: "Create GitHub OIDC provider" }

Parameters:
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.micro, t4g.small, t4g.medium]
    Description: ARM (Graviton). t4g.small = 2 GB memory
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Latest Amazon Linux 2023 ARM64 image
  DomainProd:
    Type: String
    AllowedPattern: "^[a-z0-9-]+(\\.[a-z0-9-]+)+$"
    Description: "e.g. duriseo-api.duckdns.org"
  DomainDev:
    Type: String
    AllowedPattern: "^[a-z0-9-]+(\\.[a-z0-9-]+)+$"
    Description: "e.g. duriseo-dev-api.duckdns.org"
  AcmeEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+$"
    Description: Email for Let's Encrypt certificate notices
  GoogleWebClientId:
    Type: String
    MinLength: 1
  KakaoAppId:
    Type: String
    AllowedPattern: "^[0-9]+$"
  FirebaseProjectId:
    Type: String
    MinLength: 1
  GitHubRepository:
    Type: String
    Default: DuriseoApp/Server
  GitHubRepositoryWithIds:
    Type: String
    Default: DuriseoApp@341789341/Server@1418469990
    AllowedPattern: "^[^@/]+@[0-9]+/[^@/]+@[0-9]+$"
    Description: >-
      GitHub now puts owner and repository IDs in the OIDC subject (repo:OWNER@ID/REPO@ID:...).
      IDs: GET https://api.github.com/repos/OWNER/REPO (owner.id, id)
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set false if this AWS account already has a GitHub OIDC provider

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  # ---------- Storage ----------

  BackupBucket:
    Type: AWS::S3::Bucket
    # Keep backups even if the stack is deleted
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-after-30-days
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - { Key: Project, Value: duriseo }

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub "${BackupBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  ImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: duriseo-server
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "keep the latest 20 images",
                "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 20 },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - { Key: Project, Value: duriseo }

  # ---------- Server ----------

  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: duriseo server - HTTP/HTTPS only (no SSH, use SSM Session Manager)
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: "HTTP (certificate issue, redirect)" }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
        - { IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTP/3 }
      Tags:
        - { Key: Name, Value: duriseo-server }
        - { Key: Project, Value: duriseo }

  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: duriseo server (EC2)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # SSM agent: deploy commands and console Session Manager
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: duriseo-server
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadSettings
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/duriseo/config/*"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/duriseo/secret/*"
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PullImages
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !GetAtt ImageRepository.Arn
              - Sid: Backups
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${BackupBucket.Arn}/*"
              - Sid: ListBackups
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BackupBucket.Arn
      Tags:
        - { Key: Project, Value: duriseo }

  ServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ServerRole]

  Server:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref ServerInstanceProfile
      SecurityGroupIds: [!GetAtt ServerSecurityGroup.GroupId]
      # Prevent accidental termination. Turn it off before deleting the server (docs/DEPLOY.md)
      DisableApiTermination: true
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 20
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: duriseo-server }
        - { Key: Project, Value: duriseo }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Runs once on first boot: Docker, Docker Compose, swap, folders.
          # The apps and the DB are started by the first deploy (GitHub Actions).
          set -euxo pipefail

          dnf install -y aws-cfn-bootstrap
          signal() { /opt/aws/bin/cfn-signal -e "$1" --stack "${AWS::StackName}" --resource Server --region "${AWS::Region}" || true; }
          trap 'signal 1' ERR

          dnf install -y docker
          mkdir -p /etc/docker
          cat > /etc/docker/daemon.json <<'JSON'
          { "log-driver": "json-file", "log-opts": { "max-size": "10m", "max-file": "5" } }
          JSON
          systemctl enable --now docker

          COMPOSE_VERSION=v5.5.1
          COMPOSE_SHA256=732e3a84c1a0f67256ce80bc2598a24546b10ca05f9faa97efceb1171ece2ef7
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL -o /tmp/docker-compose "https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-aarch64"
          echo "$COMPOSE_SHA256  /tmp/docker-compose" | sha256sum -c -
          install -m 755 /tmp/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version

          # 2 GB swap: two Java apps and the DB share 2 GB of memory
          if [ ! -f /swapfile ]; then
            fallocate -l 2G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          sysctl -w vm.swappiness=10
          echo 'vm.swappiness=10' > /etc/sysctl.d/90-duriseo.conf

          install -d -m 755 /opt/duriseo /opt/duriseo/releases
          install -d -m 700 /opt/duriseo/state

          signal 0

  ServerIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Server
      Tags:
        - { Key: Name, Value: duriseo-server }
        - { Key: Project, Value: duriseo }

  # ---------- GitHub Actions deploy ----------

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GitHub Actions deploy for duriseo server (main branch and deploy environments only)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Not usable from pull requests: main branch and deploy environments only
                token.actions.githubusercontent.com:sub:
                  # New subject format with immutable IDs (what GitHub sends today)
                  - !Sub "repo:${GitHubRepositoryWithIds}:ref:refs/heads/main"
                  - !Sub "repo:${GitHubRepositoryWithIds}:environment:development"
                  - !Sub "repo:${GitHubRepositoryWithIds}:environment:production"
                  # Older name-only format, kept in case GitHub sends it
                  - !Sub "repo:${GitHubRepository}:ref:refs/heads/main"
                  - !Sub "repo:${GitHubRepository}:environment:development"
                  - !Sub "repo:${GitHubRepository}:environment:production"
      Policies:
        - PolicyName: duriseo-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadSettings
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/duriseo/config/*"
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ImageRepository.Arn
              - Sid: RunDeployOnServer
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Server}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Sid: ReadDeployResult
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"
      Tags:
        - { Key: Project, Value: duriseo }

  # ---------- Settings (Parameter Store) ----------
  # Secrets (/duriseo/secret/*) are not in this template. Create them as SecureString in the console (docs/SETUP.md)

  ParamDomainProd:
    Type: AWS::SSM::Parameter
    Properties: { Name: /duriseo/config/DOMAIN_PROD, Type: String, Value: !Ref DomainProd }
  ParamDomainDev:
    Type: AWS::SSM::Parameter
    Properties: { Name: /duriseo/config/DOMAIN_DEV, Type: String, Value: !Ref DomainDev }
  ParamAcmeEmail:
    Type: AWS::SSM::Parameter
    Properties: { Name: /duriseo/config/ACME_EMAIL, Type: String, Value: !Ref AcmeEmail }
  ParamGoogleWebClientId:
    Type: AWS::SSM::Parameter
    Properties: { Name: /duriseo/config/GOOGLE_WEB_CLIENT_ID, Type: String, Value: !Ref GoogleWebClientId }
  ParamKakaoAppId:
    Type: AWS::SSM::Parameter
    Properties: { Name: /duriseo/config/KAKAO_APP_ID, Type: String, Value: !Ref KakaoAppId }
  ParamFirebaseProjectId:
    Type: AWS::SSM::Parameter
    Properties: { Name: /duriseo/config/FIREBASE_PROJECT_ID, Type: String, Value: !Ref FirebaseProjectId }
  ParamBackupBucket:
    Type: AWS::SSM::Parameter
    Properties: { Name: /duriseo/config/BACKUP_BUCKET, Type: String, Value: !Ref BackupBucket }
  ParamEcrRepositoryUri:
    Type: AWS::SSM::Parameter
    Properties: { Name: /duriseo/config/ECR_REPOSITORY_URI, Type: String, Value: !GetAtt ImageRepository.RepositoryUri }
  ParamInstanceId:
    Type: AWS::SSM::Parameter
    Properties: { Name: /duriseo/config/INSTANCE_ID, Type: String, Value: !Ref Server }

Outputs:
  ServerPublicIp:
    Description: Put this IP into both DuckDNS domains
    Value: !Ref ServerIp
  DeployRoleArn:
    Description: Put this into the GitHub repository secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  InstanceId:
    Description: Server instance ID (for Session Manager)
    Value: !Ref Server
  BackupBucketName:
    Description: Prod DB backup bucket (kept 30 days)
    Value: !Ref BackupBucket
